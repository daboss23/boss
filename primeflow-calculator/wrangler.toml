# Cloudflare Pages project config. Secrets (ANTHROPIC_API_KEY, TURNSTILE_SECRET_KEY,
# RESEND_API_KEY) are set in the Pages dashboard or with `wrangler pages secret put`.
name = "primeflow-profit-recovery"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "primeflow-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Browser Rendering fallback for JavaScript-heavy sites (optional).
# [browser]
# binding = "BROWSER"

[vars]
ANTHROPIC_MODEL = "claude-haiku-4-5"
ANTHROPIC_RESEARCH_MODEL = "claude-sonnet-5"
MAX_RESEARCH_PER_DAY = "100"
